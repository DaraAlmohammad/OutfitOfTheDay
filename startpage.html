<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outfit of the day</title>
    <link rel="stylesheet" href="startpageStyle.css">
</head>
<body>
    <header class="webbheader"></header>
    <main class="startpage">
        <form id="filter-form">
            <div class="filters">
                <select id="seasons" name="season">
                    <option value="">Choose season</option>
                </select>
                <select id="colors" name="color">
                    <option value="">Choose color</option>
                </select>
            </div>
            <div class="favorite-options">
                <label>
                    All
                    <input type="radio" name="favorite" value="0" checked=""> 
                </label>
                <label>
                    Only favorites
                    <input type="radio" name="favorite" value="1">
                </label>
            </div>
            <button id="filter">Filter</button>
        </form>
        <div class="mypage-button">
                <button id="myprofile">My profile</button>
            </div>
    </main>
</body>
</html>
